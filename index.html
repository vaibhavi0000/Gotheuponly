    <script>
      (function() {
        try {
          // 1. Prevent unhandled AbortError and aborted signal errors from surfacing to error listeners
          var isAbortError = function(err) {
            if (!err) return false;
            var name = err.name || '';
            var msg = err.message || (typeof err === 'string' ? err : '');
            return (
              name === 'AbortError' ||
              msg.indexOf('aborted without reason') !== -1 ||
              msg.indexOf('signal is aborted') !== -1 ||
              msg.indexOf('The operation was aborted') !== -1 ||
              msg.indexOf('The user aborted a request') !== -1
            );
          };

          window.addEventListener('unhandledrejection', function(event) {
            if (event && isAbortError(event.reason)) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
              if (typeof event.stopPropagation === 'function') {
                event.stopPropagation();
              }
              return true;
            }
          }, true);

          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || '')) || '';
            var err = event && event.error;
            if (isAbortError(err) || msg.indexOf('aborted without reason') !== -1 || msg.indexOf('signal is aborted') !== -1) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
              if (typeof event.stopPropagation === 'function') {
                event.stopPropagation();
              }
              return true;
            }
          }, true);

          // 2. Wrap window.fetch safely
          var _native = window.fetch;
          if (typeof _native === 'function') {
            var _safeFetch = function() {
              try {
                var p = _native.apply(window, arguments);
                if (p && typeof p.catch === 'function') {
                  return p.catch(function(err) {
                    if (isAbortError(err)) {
                      return new Response(JSON.stringify({ aborted: true }), {
                        status: 499,
                        headers: { 'Content-Type': 'application/json' }
                      });
                    }
                    return Promise.reject(err);
                  });
                }
                return p;
              } catch (e) {
                if (isAbortError(e)) {
                  return Promise.resolve(new Response(JSON.stringify({ aborted: true }), { status: 499 }));
                }
                return Promise.reject(e);
              }
            };
            var propDesc = {
              get: function() {
                return _safeFetch;
              },
              set: function(fn) {
                if (typeof fn === 'function') {
                  _safeFetch = function() {
                    try {
                      var p = fn.apply(window, arguments);
                      if (p && typeof p.catch === 'function') {
                        return p.catch(function(err) {
                          if (isAbortError(err)) {
                            return new Response(JSON.stringify({ aborted: true }), {
                              status: 499,
                              headers: { 'Content-Type': 'application/json' }
                            });
                          }
                          return Promise.reject(err);
                        });
                      }
                      return p;
                    } catch (e) {
                      if (isAbortError(e)) {
                        return Promise.resolve(new Response(JSON.stringify({ aborted: true }), { status: 499 }));
                      }
                      return Promise.reject(e);
                    }
                  };
                } else {
                  _safeFetch = fn;
                }
              },
              configurable: true,
              enumerable: true,
            };
            try {
              Object.defineProperty(window, 'fetch', propDesc);
            } catch (e) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', propDesc);
              } catch (e) {}
            }
          }
        } catch (e) {}
      })();
    </script>
